name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build release assets for
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Quick validate
        working-directory: skill/acltd/scripts
        run: python quick_validate.py

      - name: Build release archives
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="acltd-public-repo-kit-${TAG}/" \
            -o "dist/acltd-public-repo-kit-${TAG}.zip" "${TAG}"
          git archive --format=zip --prefix="acltd/" \
            -o "dist/acltd_skill_${TAG}.zip" "${TAG}:skill/acltd"
          cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --verify-tag \
              --title "ACLTD ${TAG}" --generate-notes
          fi
